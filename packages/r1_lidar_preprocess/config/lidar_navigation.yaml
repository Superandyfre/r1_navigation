/**:
  ros__parameters:
    # Transform the cloud before filtering and projection.  The sensor is
    # mounted with roll/pitch, so projecting directly in lidar_link is wrong.
    target_frame: base_link
    transform_tolerance: 0.10

    # Ground is approximately z=-0.09 in base_link.  The lower bound keeps
    # returns at least 0.05 m above ground; the upper bound retains the
    # mobile-base collision band while allowing an overhead clearance test.
    # These are experiment values, not real-robot sensor parameters.
    min_height: -0.04
    max_height: 0.55

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648  # pi/360; 0.5 degree
    scan_time: 0.10
    range_min: 0.15
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10
