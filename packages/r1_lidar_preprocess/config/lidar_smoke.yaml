/**:
  ros__parameters:
    # Transform the cloud before filtering and projection.  The sensor is
    # mounted with roll/pitch, so projecting directly in lidar_link is wrong.
    target_frame: base_link
    transform_tolerance: 0.10

    # base_link is about 0.09 m above the ground in the current simulation.
    # These are navigation experiment values, not hardware calibration.
    min_height: -0.04
    max_height: 0.55

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.09817477042468103  # 2*pi/64; smoke profile
    scan_time: 0.10
    range_min: 0.15
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10
