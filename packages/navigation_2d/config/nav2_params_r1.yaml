bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.01
      required_movement_angle: 0.0175
      movement_time_allowance: 5.0
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.8
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      closed_loop: true
      use_path_orientations: false
      transform_tolerance: 0.3
      # plugin: "dwb_core::DWBLocalPlanner"
      prune_distance: 1.0
      forward_prune_distance: 2.0
      epsilon: 0.1
      debug_trajectory_details: True
      publish_cost_grid_pc: True
      max_vel_x: 0.3
      min_vel_x: 0.0
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_speed_xy: 0.3
      min_speed_xy: 0.03
      max_vel_theta: 0.3
      min_speed_theta: 0.01
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.8
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.8
      vx_samples: 51
      vy_samples: 0
      vtheta_samples: 21
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: false
      include_last_point: false
      stateful: True
      critics: ["PathDist", "GoalDist", "PathAlign", "GoalAlign", "RotateToGoal", "PreferForward", "ObstacleFootprint", "Clearance", "Oscillation"]
      PathDist.scale: 16.0
      PathDist.aggregation_type: "sum"
      GoalDist.scale: 12.0
      GoalDist.aggregation_type: "last"
      PathAlign.scale: 16.0
      PathAlign.aggregation_type: "sum"
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      RotateToGoal.scale: 32.0
      RotateToGoal.xy_goal_tolerance: 0.25
      RotateToGoal.trans_stopped_velocity: 0.1
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      PreferForward.scale: 10.0
      PreferForward.penalty: 1.0
      PreferForward.strafe_x: -1.0
      PreferForward.strafe_theta: -1.0
      PreferForward.theta_scale: -0.0
      Twirling.scale: 12.0
      BaseObstacle.scale: 2.2
      BaseObstacle.sum_scores: false
      ObstacleFootprint.scale: 4.0
      ObstacleFootprint.sum_scores: false
      Clearance.class: "navigation_2d::ClearanceCritic"
      Clearance.scale: 32.0
      Clearance.preferred_clearance: 0.15
      Clearance.penalty_exponent: 2.0
      Oscillation.scale: 5.0
      Oscillation.oscillation_reset_dist: 0.3
      Oscillation.oscillation_reset_angle: 0.2
      Oscillation.oscillation_reset_time: 2.0
      Oscillation.x_only_threshold: 0.05

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      # The global override layer consumes the full OccupancyGrid topic.
      # Keep this 5 x 5 m rolling map current on every publication.
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        min_obstacle_height: -2.0
        combination_method: 1
        observation_sources: "front_scan"
        front_scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          # LaserScan observations are planar (z=0); a positive floor filter
          # would silently drop every return.
          max_obstacle_height: 1.8
          min_obstacle_height: -1.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "local_costmap_override"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        min_obstacle_height: -2.0
        combination_method: 1
        observation_sources: "front_scan"
        front_scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          # LaserScan observations are planar (z=0); a positive floor filter
          # would silently drop every return.
          max_obstacle_height: 1.8
          min_obstacle_height: -1.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.25
      local_costmap_override:
        plugin: "navigation_2d::LocalCostmapOverrideLayer"
        map_topic: /local_costmap/costmap
        max_age: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      # The R1 base is differential drive; this 5 cm lattice matches the global costmap resolution.
      lattice_filepath: "/home/rpp/rpp_ws/install/nav2_smac_planner/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_penalty: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      retrospective_penalty: 0.015
      rotation_penalty: 5.0
      allow_reverse_expansion: false
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.8
