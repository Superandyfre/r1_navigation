# HW1 profile. Its launch requires a mechanical calibration record before use.
receding: 20
step_time: 0.25
ref_speed: 0.20
device: 'cpu'
time_print: false
bypass_enabled: true
bypass_lateral_scale: 0.20
bypass_min_clearance: 0.05
# NRMP constrains its distance slack to d_min=0.01. The collision threshold
# must be strictly below that numerical lower bound or every finite solve is
# falsely reported as a collision due to floating-point roundoff.
collision_threshold: 0.005

robot:
  kinematics: 'diff'
  max_speed: [0.20, 0.25]
  max_acce: [0.30, 0.50]
  length: 0.682
  width: 0.532
  smooth_weight: 0.05
  path_relative_cost: true
  geometry_collision_cost: true
  geometry_margin_m: 0.08

ipath:
  # Preserve local path geometry for the short receding horizon.
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.242
  loop: true
  # NeuPAN must not declare arrival before Nav2's 0.10 m goal checker can
  # complete the task.  A 0.5 m threshold caused legitimate short paths to
  # produce a permanent zero command while Nav2 still reported progress due.
  arrive_threshold: 0.05
  close_threshold: 0.05
  arrive_index_threshold: 3

pan:
  iter_num: 2
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: null
  iter_threshold: 0.1

adjust:
  # Keep the optimized horizon anchored to the SMAC route.  The previous
  # balance let a clear corridor produce an unnecessary detour, which was
  # then rejected by the independent path-deviation guard.  Position weights
  # now dominate the soft clearance preference; yaw remains softer so a real
  # obstacle can still induce a controlled turn.
  q_s: [8.0, 10.0, 2.5]
  # Track longitudinal reference speed more closely; this is not a slew penalty.
  p_u: 1.4
  # This is a soft reward for extra clearance, not the collision constraint.
  # Keep physical collision protection unchanged while avoiding a needless
  # refusal of a corridor that the measured footprint can clear.
  eta: 3.5
  d_max: 0.1
  d_min: 0.01
  ro_obs: 4000
