# HW1 profile. Its launch requires a mechanical calibration record before use.
receding: 20
step_time: 0.25
ref_speed: 0.5
device: 'cpu'
time_print: false
# DUNE current-pose threshold, separate from NRMP distance variables. When
# candidate avoidance is enabled, feasible escape trajectories are assessed
# across the horizon instead of blocking solely on this current-pose value.
collision_threshold: 0.005

robot:
  kinematics: 'diff'
  max_speed: [0.5, 0.25]
  max_acce: [0.50, 0.50]
  length: 0.682
  width: 0.532
  smooth_weight: 0.05
  path_relative_cost: true

ipath:
  # Preserve local path geometry for the short receding horizon.
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.242
  loop: true
  # NeuPAN must not declare arrival before Nav2's 0.10 m goal checker can
  # complete the task.  A 0.5 m threshold caused legitimate short paths to
  # produce a permanent zero command while Nav2 still reported progress due.
  arrive_threshold: 0.05
  close_threshold: 0.05
  arrive_index_threshold: 3

pan:
  iter_num: 3
  candidate_avoidance_enabled: true
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: null
  iter_threshold: 0.1

adjust:
  # Balance reference tracking against NeuPAN's obstacle cost. Candidate
  # trajectories can deviate to pass an obstacle and then rejoin the route.
  q_s: [4.0, 3.0, 1.0]
  # Track longitudinal reference speed more closely; this is not a slew penalty.
  p_u: 1.4
  # Distance objective and bounds are internal NeuPAN optimization terms.
  eta: 3.8
  d_max: 0.15
  d_min: 0.05
  ro_obs: 4000
