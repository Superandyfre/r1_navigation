bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.01
      required_movement_angle: 0.0175
      # Shadow mode never moves the chassis. Allow the one-time CPU worker
      # model load and its configured warm-up to finish before reporting the
      # expected no-progress outcome.
      movement_time_allowance: 45.0
    FollowPath:
      plugin: "navigation_neupan_bridge/NeuPANController"
      navigation_frame: "map"
      path_topic: "/neupan_path"
      goal_topic: "/neupan_goal"
      envelope_topic: "/neupan_cmd_envelope"
      gate_command_topic: "/cmd_vel"
      localization_health_topic: "/r1_localization_health"
      diagnostics_topic: "/neupan_controller_status"
      envelope_timeout: 0.30
      # The worker is asynchronous. Hold zero velocity only while its first
      # result for a newly published path arrives; then normal freshness rules apply.
      envelope_startup_timeout: 40.0
      max_linear: 0.15
      max_angular: 0.40
      shadow_mode: true
      require_gate_match: false
      command_match_epsilon: 0.0001
      localization_health_timeout: 0.50
      localization_startup_timeout: 10.0
      require_localization_ready: true

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      # The global override layer consumes the full OccupancyGrid topic.
      # Keep this 5 x 5 m rolling map current on every publication.
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        min_obstacle_height: -2.0 
        combination_method: 1
        observation_sources: "back_laser pointcloud"
        back_laser:
          topic: /laser/scan_undistort
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          max_obstacle_height: 1.8
          min_obstacle_height: 0.15
        pointcloud:
          topic: /navigation/pointcloud_filtered
          data_type: "PointCloud2"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          max_obstacle_height: 1.8
          min_obstacle_height: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # Must not be smaller than Nav2's 0.36 m inscribed footprint radius.
        inflation_radius: 0.36

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[-0.35, -0.35], [-0.35, 0.35], [0.35, 0.35], [0.35, -0.35]]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "local_costmap_override"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        min_obstacle_height: -2.0 
        combination_method: 1
        observation_sources: "back_laser pointcloud"
        back_laser:
          topic: /laser/scan_undistort
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          max_obstacle_height: 1.8
          min_obstacle_height: 0.15
        pointcloud:
          topic: /navigation/pointcloud_filtered
          data_type: "PointCloud2"
          clearing: True
          marking: True
          raytrace_max_range: 20.0
          raytrace_min_range: 0.1
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          max_obstacle_height: 1.8
          min_obstacle_height: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # Keep the global safety margin consistent with the local costmap.
        inflation_radius: 0.36
      local_costmap_override:
        plugin: "navigation_2d::LocalCostmapOverrideLayer"
        map_topic: /local_costmap/costmap
        max_age: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      # The R1 base is differential drive; this 5 cm lattice matches the global costmap resolution.
      lattice_filepath: "/home/rpp/rpp_ws/install/nav2_smac_planner/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      tolerance: 0.5
      allow_unknown: false
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_penalty: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      retrospective_penalty: 0.015
      rotation_penalty: 5.0
      allow_reverse_expansion: false
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.8
