# HW0 candidate only. Values are sourced from the existing R1 navigation envelope
# and must be replaced by the recorded mechanical measurement before HW1.
receding: 6
step_time: 0.25
ref_speed: 0.15
device: 'cpu'
time_print: false
collision_threshold: 0.01

robot:
  kinematics: 'diff'
  max_speed: [0.15, 0.4]
  max_acce: [0.30, 0.80]
  length: 0.682
  width: 0.532

ipath:
  interval: 0.2
  curve_style: 'line'
  min_radius: 0.242
  loop: true
  arrive_threshold: 0.5
  close_threshold: 0.05
  arrive_index_threshold: 3

pan:
  iter_num: 2
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: null
  iter_threshold: 0.1

adjust:
  q_s: 0.1
  p_u: 1.0
  eta: 10.0
  d_max: 0.1
  d_min: 0.01
