# This must match the explicit Node(name=...) in r1_neupan_hw1_motion.launch.py.
# ROS 2 otherwise silently leaves this whole parameter block unapplied.
n1_16_production_bridge:
  ros__parameters:
    use_sim_time: false
    robot_type: 'r1_hw1_measured_profile_required'
    robot_description: 'HW1 profile sourced from the recorded R1 calibration supplied at launch.'
    planner_config_file: 'planner_r1_hw1.yaml'
    dune_checkpoint_file: 'models/dune_model_5000.pth'
    map_frame: 'map'
    base_frame: 'base_link'
    lidar_frame: 'base_link'
    scan_topic: '/scan_neupan'
    plan_input_topic: '/neupan_path'
    goal_topic: '/neupan_goal'
    # One path publication is one context, regardless of companion goal order.
    goal_from_path_only: true
    # A+ fatal recovery is an operator-controlled full runtime restart.
    worker_recovery_enabled: false
    require_execution_context: true
    execution_context_topic: /neupan_execution_context
    worker_health_topic: /neupan_worker_health
    worker_health_period_sec: 0.10
    odom_topic: '/odom'
    cmd_vel_topic: '/neupan_cmd_vel'
    plan_output_topic: '/neupan_plan'
    ref_state_topic: '/neupan_ref_state'
    timing_topic: '/neupan_timing'
    scan_range_min: 0.15
    scan_range_max: 8.0
    scan_downsample: 1
    # The Livox projection is already in base_link. Remove only chassis
    # self-returns before NeuPAN consumes the scan.
    self_filter_enabled: true
    # Rectangle fallback for earlier profiles. HW1 uses the measured polygon
    # below because the forward-right chassis and bracket are not rectangular.
    self_filter_front_m: 0.371
    self_filter_rear_m: 0.371
    self_filter_left_m: 0.296
    self_filter_right_m: 0.296
    # Surveyed base_link chassis/bracket exclusion outline. It covers the
    # repeated empty-scene self returns around (+0.22, -0.30) m without
    # enlarging the complete right-side rectangle. Review it against the
    # 1,000-frame stationary capture before each mechanical alteration.
    self_filter_polygon_xy: [-0.371, -0.296, 0.150, -0.296, 0.150, -0.340,
                             0.450, -0.360, 0.450, -0.296, 0.371, -0.296,
                             0.371, 0.296, -0.371, 0.296]
    self_filter_polygon_margin_m: 0.0
    include_initial_path_direction: true
    # SMAC replans every second and advances only the path prefix as the R1
    # moves. Keep the current NeuPAN context until its terminal goal changes;
    # otherwise the single asynchronous worker can never return a matching
    # result before the next SMAC tick.
    refresh_initial_path: false
    control_frequency: 10.0
    # Admit small confirmed yaw corrections before heading error accumulates.
    command_stabilizer_angular_deadband_radps: 0.02
    latest_scan_only: true
    max_path_deviation_m: 0.15
    # The full-horizon error is diagnostic-only. Stop only after a sustained
    # near-term departure from the route, so an obstacle-avoidance prediction
    # does not repeatedly halt an otherwise safe base command.
    path_deviation_near_term_states: 2
    path_deviation_warn_m: 0.15
    path_deviation_stop_m: 0.20
    path_deviation_stop_cycles: 3
    # NeuPAN slows along its route only when the swept base/arm geometry sees
    # an obstruction. These values affect longitudinal stopping, not the
    # lateral costmap inflation used to pass narrow gaps.
    obstacle_motion_enabled: true
    neupan_bypass_enabled: true
    local_detour_enabled: false
    reverse_escape_enabled: false
    obstacle_braking_mps2: 0.20
    obstacle_reaction_sec: 0.30
    obstacle_stop_margin_m: 0.20
    obstacle_preview_m: 0.90
    obstacle_odom_timeout_sec: 0.50
    # Mesh components are the exact, non-convex arm geometry for NeuPAN. They
    # are recomputed at about 4 Hz; the separate convex footprint remains the
    # 10 Hz immediate safety gate.
    dynamic_mesh_components_timeout_sec: 1.50
    # Exact mesh overlap counts are diagnostic-only and too expensive to run
    # for every live scan. Safety filtering and geometry projection remain on.
    mesh_overlap_diagnostics_enabled: false
    # One representative startup solve initializes the isolated worker before
    # its first live envelope. Repeating 30 warmups delayed the first command
    # beyond the controller's bounded startup window on this CPU profile.
    n115_warmup_count: 1
    # NeuPAN owns bypass trajectories. The independent swept check still
    # rejects an unsafe candidate before its command reaches the base.
    forward_only_enabled: false
    allow_reverse: true
    # Opposite-direction planner actions must stop and rewrite the NeuPAN
    # path gear before reaching the closed-loop velocity smoother.
    auto_gear_transition_enabled: true
    auto_gear_mismatch_deadband_mps: 0.025
    auto_gear_confirm_cycles: 5
    # A transient opposite signed NeuPAN sample must not start a base reversal.
    auto_gear_opposite_direction_commit_cycles: 4
    auto_gear_stopped_speed_mps: 0.015
    auto_gear_stop_timeout_sec: 2.0
    auto_gear_odom_timeout_sec: 0.5
    # Used only for read-only path-yaw diagnostics if forward_only is enabled.
    forward_only_lookahead_m: 0.35
    forward_only_max_forward_speed_mps: 0.15
    # HW1 never authorizes the shadow-only TF fault hook.
    shadow_tf_fault_injection_allowed: false
    shadow_force_robot_tf_failure: false
